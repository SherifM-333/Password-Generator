<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <title>Password Generator</title>
  </head>
  <body>
    <div id="main-container">
        <h1 id="card-heading">Generate a<br><span class="green-text">random password</span></h1>
        <p id="card-description">Never use an insecure password again.</p>
        <button id="card-generate-btn">Generate passwords</button>
        <hr>
        <div id="password-container">
            <div id="pass-one">
                <h2 class="pass-header">Password One (Click to copy)</h2>
                <div class="pass-area">
                    <p id="pass-one-text"></p>
                </div>
            </div>
            <div id="pass-two">
                <h2 class="pass-header">Password Two (Click to copy)</h2>
                <div class="pass-area">
                    <p id="pass-two-text"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
